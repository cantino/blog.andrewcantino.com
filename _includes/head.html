<head>

  <title>

  <!-- Favicon -->

  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon-16x16.png" | relative_url }}">
  <link rel="apple-touch-icon" sizes="144x144" href="{{ "/assets/apple-touch-icon.png" | relative_url }}">
